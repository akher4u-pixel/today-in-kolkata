name: Update daily rates

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 IST
    - cron: "30 5 * * *"   # 11:00 IST
    - cron: "30 11 * * *"  # 17:00 IST
  workflow_dispatch:        # run by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch gold, petrol and diesel
        run: python update.py
      - name: Save changes
        if: always()
        run: |
          if [ -n "$(git status --porcelain rates.json fuel.json)" ]; then
            git config user.name "rate-bot"
            git config user.email "rate-bot@users.noreply.github.com"
            git add rates.json fuel.json
            git commit -m "Update daily rates"
            git push
          else
            echo "No change"
          fi
